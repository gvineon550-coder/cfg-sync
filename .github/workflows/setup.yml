name: setup
on: workflow_dispatch

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run setup.sh
        run: |
          bash setup.sh || true
          rm -f .github/workflows/build.yml
          rm -f .github/workflows/sync.yml
          rm -f .github/workflows/add-device.yml
          ls -la
      - name: Commit
        run: |
          git config user.name "actions"
          git config user.email "actions@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "setup"
          git push
