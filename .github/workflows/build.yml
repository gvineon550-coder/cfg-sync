name: build
on:
  push:
    branches: [ main ]
    paths:
      - 'app/**'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - 'gradle.properties'
      - 'gradlew'
      - '.github/workflows/build.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | sdkmanager --licenses > /dev/null 2>&1 || true

      - name: Ensure gradle wrapper
        run: |
          if [ ! -f gradlew ]; then
            sudo apt-get update && sudo apt-get install -y gradle || true
            gradle wrapper --gradle-version 8.9 --distribution-type all || true
          fi
          chmod +x gradlew || true

      - name: Build
        env:
          SGN_B64: ${{ secrets.SGN_B64 }}
          SGN_P1: ${{ secrets.SGN_P1 }}
          SGN_K: ${{ secrets.SGN_K }}
        run: |
          if [ -z "${SGN_B64:-}" ]; then
            ./gradlew assembleDebug --stacktrace
            mkdir -p out && cp app/build/outputs/apk/debug/*.apk out/App.apk
          else
            ./gradlew assembleRelease --stacktrace
            mkdir -p out && cp app/build/outputs/apk/release/*.apk out/App.apk
          fi

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Sync (latest)"
          files: out/App.apk
          make_latest: true
